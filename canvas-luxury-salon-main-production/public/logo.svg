<svg xmlns="http://www.w3.org/2000/svg" width="236" height="68" viewBox="0 0 236 68" fill="none" role="img" aria-label="Huma Beauty Salon">
  <defs>
    <linearGradient id="humaCrest" x1="8" y1="6" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#148066"/>
      <stop offset="0.55" stop-color="#0d6a54"/>
      <stop offset="1" stop-color="#084739"/>
    </linearGradient>
    <linearGradient id="humaGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d4b06a"/>
      <stop offset="1" stop-color="#9a7340"/>
    </linearGradient>
    <linearGradient id="humaInk" x1="72" y1="20" x2="230" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d2620"/>
      <stop offset="1" stop-color="#1a4a3d"/>
    </linearGradient>
  </defs>

  <!-- Crest badge -->
  <path
    d="M12 18C12 10.8 17.8 5 25 5h22c7.2 0 13 5.8 13 13v28c0 7.2-5.8 13-13 13H25c-7.2 0-13-5.8-13-13V18Z"
    fill="url(#humaCrest)"
  />
  <path
    d="M16.5 20.5C16.5 14.5 21.3 9.5 27.3 9.5h17.4c6 0 10.8 5 10.8 11v23c0 6-4.8 11-10.8 11H27.3c-6 0-10.8-5-10.8-11v-23Z"
    stroke="#ffffff"
    stroke-opacity="0.22"
    stroke-width="1"
  />

  <!-- Gold crown flourish -->
  <path
    d="M22 12.5c6.5-2.2 13.5-2.2 20 0"
    stroke="url(#humaGold)"
    stroke-width="1.6"
    stroke-linecap="round"
  />
  <circle cx="32" cy="10.8" r="1.2" fill="url(#humaGold)"/>
  <circle cx="36" cy="9.8" r="1.6" fill="url(#humaGold)"/>
  <circle cx="40" cy="10.8" r="1.2" fill="url(#humaGold)"/>

  <!-- Stylized H — flowing crossbar (hair / elegance motif) -->
  <path
    d="M27 18v28M43 18v28M27 32c4.5-3.5 9-5.5 16-6.5"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M27 32c4.5 3.5 9 5.5 16 6.5"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-opacity="0.55"
  />
  <path
    d="M46 22c2.2 1.2 2.8 3.4 1.4 4.8-1.8 1.8-4.8.4-4.8-1.8 0-1.4 1.8-2.4 3.4-3Z"
    fill="#ffffff"
    fill-opacity="0.18"
  />

  <!-- Wordmark -->
  <text
    x="72"
    y="40"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="600"
    letter-spacing="0.02em"
    fill="url(#humaInk)"
  >Huma</text>

  <!-- Gold divider with diamond -->
  <path d="M72 49h52" stroke="url(#humaGold)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M96.5 49l3 3 3-3-3-3z" fill="url(#humaGold)"/>
  <path d="M126 49h34" stroke="url(#humaGold)" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>

  <text
    x="72"
    y="62"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11.5"
    font-weight="600"
    letter-spacing="0.34em"
    fill="#0d6a54"
  >BEAUTY SALON</text>
</svg>
