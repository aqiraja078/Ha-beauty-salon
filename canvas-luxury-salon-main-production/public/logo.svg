<svg xmlns="http://www.w3.org/2000/svg" width="210" height="68" viewBox="0 0 210 68" preserveAspectRatio="xMinYMid meet" fill="none" role="img" aria-label="HA Beauty Salon">
  <defs>
    <linearGradient id="haEmerald" x1="4" y1="4" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12876a"/>
      <stop offset="1" stop-color="#084a3b"/>
    </linearGradient>
  </defs>

  <!-- Monogram badge -->
  <rect x="3" y="4" width="60" height="60" rx="17" fill="url(#haEmerald)"/>
  <rect x="8.5" y="9.5" width="49" height="49" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1"/>
  <text
    x="33"
    y="42.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="23"
    font-weight="700"
    letter-spacing="0.03em"
    fill="#ffffff"
  >HA</text>

  <!-- Wordmark sized to match badge height -->
  <text
    x="76"
    y="36"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="36"
    font-weight="600"
    letter-spacing="0.01em"
    fill="#0d2620"
  >Beauty</text>
  <text
    x="78"
    y="58"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="0.34em"
    fill="#0d6a54"
  >SALON</text>
</svg>
